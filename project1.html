<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap 12-Column Grid Layout</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    /* Custom styling to match the colors and spacing in the image */
    .grid-box {
      color: white;
      font-weight: bold;
      text-align: center;
      padding: 12px 0;
      border: 2px solid white; /* Creates the white gap between columns */
    }
    .row-1 { background-color: #1DA1DB; }/* Light Blue */
    .row-2 { background-color: #0D8000; } /* Green */
    .row-3 { background-color: #0055EE; } /* Royal Blue */
    .row-4 { background-color: #5500FF; } /* Indigo/Purple */
    .row-5 { background-color: #8F00FF; } /* Violet */
    .row-6 { background-color: #D4006A; } /* Magenta/Pink */
    .row-7 { background-color: #8B0018; } /* Dark Red */
  </style>
</head>
<body class="p-3">

  <div class="container-fluid">
    
    <!-- Row 1: Twelve 'col-1' blocks (1 x 12 = 12) -->
    <div class="row">
        <div class ="background-color-warning"></div>
      <div class="col-1 grid-box row-1">col 1</div>
      <div class="col-1 grid-box row-1">col 1</div>
      <div class="col-1 grid-box row-1">col 1</div>
      <div class="col-1 grid-box row-1">col 1</div>
      <div class="col-1 grid-box row-1">col 1</div>
      <div class="col-1 grid-box row-1">col 1</div>
      <div class="col-1 grid-box row-1">col 1</div>
      <div class="col-1 grid-box row-1">col 1</div>
      <div class="col-1 grid-box row-1">col 1</div>
      <div class="col-1 grid-box row-1">col 1</div>
      <div class="col-1 grid-box row-1">col 1</div>
      <div class="col-1 grid-box row-1">col 1</div>

    </div>

    <!-- Row 2: Four 'col-3' blocks (3 x 4 = 12) -->
    <div class="row">
      <div class="col-3 grid-box row-2">col 3</div>
      <div class="col-3 grid-box row-2">col 3</div>
      <div class="col-3 grid-box row-2">col 3</div>
      <div class="col-3 grid-box row-2">col 3</div>
    </div>

    <!-- Row 3: Three 'col-4' blocks (4 x 3 = 12) -->
    <div class="row">
      <div class="col-4 grid-box row-3">col 4</div>
      <div class="col-4 grid-box row-3">col 4</div>
      <div class="col-4 grid-box row-3">col 4</div>
    </div>

    <!-- Row 4: One 'col-8' and one 'col-4' (8 + 4 = 12) -->
    <div class="row">
      <div class="col-8 grid-box row-4">col 8</div>
      <div class="col-4 grid-box row-4">col 4</div>
    </div>

    <!-- Row 5: Mixed sizes (2 + 2 + 4 + 2 + 2 = 12) -->
    <div class="row">
      <div class="col-2 grid-box row-5">col 2</div>
      <div class="col-2 grid-box row-5">col 2</div>
      <div class="col-4 grid-box row-5">col 4</div>
      <div class="col-2 grid-box row-5">col 2</div>
      <div class="col-2 grid-box row-5">col 2</div>
    </div>

    <!-- Row 6: Two 'col-6' blocks (6 + 6 = 12) -->
    <div class="row">
      <div class="col-6 grid-box row-6">col 6</div>
      <div class="col-6 grid-box row-6">col 6</div>
    </div>

    <!-- Row 7: One full-width 'col-12' block (12 = 12) -->
    <div class="row">
      <div class="col-12 grid-box row-7">col 12</div>
    </div>

  </div-->

</body>
</html>
